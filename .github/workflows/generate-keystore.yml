name: Generate Keystore
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS and Base64
        run: |
          keytool -genkeypair -v -keystore layalina-release-key.jks -alias layalina -keyalg RSA -keysize 2048 -validity 10000 -storepass Layalina2026 -keypass Layalina2026 -dname "CN=Layalina, OU=App, O=Layalina, L=QalatSukkar, S=DhiQar, C=IQ"
          base64 -w 0 layalina-release-key.jks > keystore_base64.txt
      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: layalina-signing-key
          path: |
            layalina-release-key.jks
            keystore_base64.txt
