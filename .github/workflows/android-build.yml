name: Build Layali Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & sync Capacitor Android
        run: |
          npm ci
          npm run android:sync

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Layali APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Layali-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Layali AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Layali-Android-Bundle-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
